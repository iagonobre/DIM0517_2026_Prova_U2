name: Node 04

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

      - name: Testes unitários
        run: npm test

      - name: Construir a imagem Docker
        run: docker build . -t api-node:${{ github.run_id }}

      - name: Levantar (rodar) a imagem docker
        run: docker run -d --name api-node -p 8080:8080 api-node:${{ github.run_id }}
